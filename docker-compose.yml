version: "3.8"

services:

  db:
    image: mariadb:11
    container_name: observium-db
    restart: always

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      TZ: ${TZ}

    command:
      --max-connections=300
      --innodb-buffer-pool-size=1G
      --query-cache-size=0
      --tmp-table-size=64M
      --max-heap-table-size=64M

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - obs-net


  observium:
    image: skjaberbhy/observium-app:26.1
    container_name: observium-app
    restart: always

    depends_on:
      - db

    env_file:
      - .env

    environment:
      DB_HOST: db

    ports:
      - "8080:80"

    volumes:
      - rrd_data:/opt/observium/rrd
      - logs_data:/opt/observium/logs
      
      

    networks:
      - obs-net


  observium-cron:
    image: skjaberbhy/observium-cron:26.1
    container_name: observium-cron
    restart: always

    depends_on:
      - db
      - observium
   
    env_file:
      - .env

    environment:
      DB_HOST: db
   
    volumes:
      - rrd_data:/opt/observium/rrd
      - logs_data:/opt/observium/logs
      

    networks:
      - obs-net


volumes:
  db_data:
  rrd_data:
  logs_data:


networks:
  obs-net:
    driver: bridge